[project]
name = "aioway"
description = "AI on the way"
authors = [
    {name = "RenChu Wang", email = "patrick1031wang@gmail.com"},
]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "numpy>=2",
    "pandas>=3",
    "torch==2.10.*",
    "tensordict>=0.11",
    "torchvision>=0.25",
    "torchcodec==0.10.*",
    "rich>=14",
    "pillow>=12",
    "av>=17",
    "transformers>=5",
    "tokenizers>=0.22",
]

[project.optional-dependencies]
networkx = [
    "networkx>=3",
    "matplotlib>=3",
]
faiss = [
    "faiss-cpu>=1.14.2",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]


[dependency-groups]
pre-commit = [
    "autoflake>=2",
    "black>=26",
    "isort>=8",
    "mypy>=1",
    "pre-commit>=4",
]
tests = [
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-randomly>=4",
    "pytest-xdist>=3",
    "pytest-timeout>=2",
    "pytest-testmon>=2",
    "pytest-sugar>=1",
    "coverage>=7",
    "gitpython>=3.1",
]
debugging = [
    "ipython>=9",
    "jupyter>=1",
    "jupyterlab>=4",
    "jupytext>=1.19",
    "pyinstrument>=5",
    "matplotlib>=3",
]
build = [
    "build>=1",
    "ninja>=1",
    "pip>=26",
    "setuptools>=81",
    "setuptools-scm>=9",
    "nox[pbs]>=2026",
]

[tool.autoflake]
in-place = true
recursive = true
exclude = "__init__.py"
expand-star-imports = true
remove-all-unused-imports = true
remove-duplicate-keys = true

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
show_error_codes = true
check_untyped_defs = true

# Skipping analysis for some modules because they are not typed.
[[tool.mypy.overrides]]
module = [
    "tensordict.*",
    "torchvision.*",
    "torchcodec.*",
]
ignore_missing_imports = true

[tool.pytest]
addopts = [
    "-v",
    "--ff",
    "--nf",
    "--import-mode=importlib",
    "--dist=loadgroup",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
testpaths = [
    "tests",
]
