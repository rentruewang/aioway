[project]
name = "aioway"
description = "AI on the way"
authors = [
    {name = "RenChu Wang", email = "patrick1031wang@gmail.com"},
]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "numpy>=2",
    "pandas>=3",
    "torch>=2",
    "tensordict>=0.11",
    "torchvision>=0.25",
    "rich>=14",
    "pillow>=12",
    "av>=17",
    "transformers>=5",
    "tokenizers>=0.22",
    "datasets>=5",
    "torchrl>=0.13",
    "lightning>=2",
    "captum>=0.9",
]

[project.optional-dependencies]
networkx = [
    "networkx>=3",
    "matplotlib>=3",
]
gym = [
    "gymnasium>=1",
]
faiss = [
    "faiss-cpu>=1",
]
sklearn = [
    "scikit-learn>=1",
]
api = [
    "fastapi>=0.141",
    "fastmcp>=3",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]


[dependency-groups]
checks = [
    "autoflake>=2",
    "black>=26",
    "isort>=8",
    "pyrefly>=1",
]
tests = [
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-randomly>=4",
    "pytest-xdist>=3",
    "pytest-timeout>=2",
    "pytest-testmon>=2",
    "coverage>=7",
    "gitpython>=3",
]
debugging = [
    "ipython>=9",
    "jupyter>=1",
    "jupyterlab>=4",
    "jupytext>=1.19",
    "pyinstrument>=5",
    "matplotlib>=3",
]
build = [
    "build>=1",
    "ninja>=1",
    "pip>=26",
    "setuptools>=81",
    "setuptools-scm>=9",
]
docs = [
    "sphinx>=9",
    "furo>=2025.12.19",
    "myst-parser>=5",
]

[tool.autoflake]
in-place = true
recursive = true
exclude = "__init__.py"
expand-star-imports = true
remove-all-unused-imports = true
remove-duplicate-keys = true

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
show_error_codes = true
check_untyped_defs = true

[tool.pytest]
addopts = [
    "-v",
    "--ff",
    "--nf",
    "--import-mode=importlib",
    "--dist=loadgroup",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing"]

[tool.pyrefly]
preset = "legacy"
ignore-missing-imports = [
    "torchcodec",
]
check-unannotated-defs = true
infer-return-types = "checked" 
